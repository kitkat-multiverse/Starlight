syntax = "proto3";

// Used between dispatch & game servers to announce connectability.
package starlight.dispatch;

option csharp_namespace = "Starlight.Rpc.Proto";

message SessionInfo {
  string account_id = 1;
}

message GateServerInfo {
  // The 'public' IP address that users will connect to.
  string external_address = 1;
  // Usually 22101 or 22102.
  uint32 external_port = 2;

  repeated SessionInfo sessions = 3;
}

// Named this way instead of just `RegionInfo` to avoid conflicts
// with the appropriately named `RegionInfo` message in `dispatch.proto`.
//
// Values specified here are used exclusively in the dispatch server.
message StarlightRegionInfo {
  // The internal identifier for the region.
  string region_id = 1;

  // The display name for the region.
  //
  // This is the value that shows up in-game.
  string region_name = 2;

  // Used by the client to derive the initial key with an
  // algorithm called "EC2B".
  bytes client_secret_key = 3;
}

// Gateway servers send this message on a regular interval
// so the dispatch server can keep track of usable gateways.
//
// Subject: `dispatch.heartbeat`
message GateHeartbeatNotify {
  GateServerInfo server_info = 1;
  StarlightRegionInfo region_info = 2;
}
